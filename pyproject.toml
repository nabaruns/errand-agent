[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat agent that arranges home-service errands against mocked providers"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
]

[project.scripts]
errand = "errand_agent.cli:main"
errand-web = "errand_agent.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["errand_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
